<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxonomic Database</title>
    
    <!-- External CSS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="/static/css/main.css" rel="stylesheet">
    <link href="/static/css/phylo-tree.css" rel="stylesheet">
    <link href="/static/css/species-cards.css" rel="stylesheet">
    <link href="/static/css/image-viewer.css" rel="stylesheet">
    <link href="/static/css/research.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Taxonomic Explorer</h1>
        
        <!-- Navigation Tabs -->
        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="explorer-tab" data-bs-toggle="tab" data-bs-target="#explorer" type="button" role="tab">
                    <i class="bi bi-search"></i> Explorer
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="phylo-tab" data-bs-toggle="tab" data-bs-target="#phylo" type="button" role="tab">
                    <i class="bi bi-diagram-3"></i> Phylogenetic Tree
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="research-tab" data-bs-toggle="tab" data-bs-target="#research" type="button" role="tab">
                    <i class="bi bi-graph-up"></i> Research
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="add-tab" data-bs-toggle="tab" data-bs-target="#add" type="button" role="tab">
                    <i class="bi bi-plus-circle"></i> Add Species
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="import-export-tab" data-bs-toggle="tab" data-bs-target="#import-export" type="button" role="tab">
                    <i class="bi bi-arrow-down-up"></i> Import/Export
                </button>
            </li>
        </ul>
        
        <!-- Tab Content -->
        <div class="tab-content" id="myTabContent">
            <!-- Explorer Tab -->
            <div class="tab-pane fade show active" id="explorer" role="tabpanel">
                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="input-group">
                            <input type="text" id="search-input" class="form-control" placeholder="Search species...">
                            <button class="btn btn-primary" type="button" id="search-button">
                                <i class="bi bi-search"></i> Search
                            </button>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div id="tag-filters" class="d-flex flex-wrap">
                            <!-- Tags will be loaded here -->
                        </div>
                    </div>
                </div>
                
                <div id="species-container" class="row">
                    <!-- Species cards will be loaded here -->
                </div>
            </div>
            
            <!-- Phylogenetic Tree Tab -->    
            <div class="tab-pane fade" id="phylo" role="tabpanel">
                <div id="phylo-content">
                    <!-- Content loaded from phylo-tree.html -->
                </div>
            </div>

            <!-- Research Tab -->
            <div class="tab-pane fade" id="research" role="tabpanel">
                <div id="research-content">
                    <!-- Content loaded from research-tab.html -->
                </div>
            </div>

            <!-- Add Species Tab -->
            <div class="tab-pane fade" id="add" role="tabpanel">
                <div id="add-species-content">
                    <!-- Content loaded from add-species-form.html -->
                </div>
            </div>
            
            <!-- Import/Export Tab -->
            <div class="tab-pane fade" id="import-export" role="tabpanel">
                <div id="import-export-content">
                    <!-- Content loaded from import-export.html -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="modals-container">
        <!-- Modals loaded from modals.html -->
    </div>

    <!-- External JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript Modules -->
    <script src="/static/js/config.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/image-viewer.js"></script>
    <script src="/static/js/species-manager.js"></script>
    <script src="/static/js/phylo-tree.js"></script>
    <script src="/static/js/tag-manager.js"></script>
    <script src="/static/js/research-manager.js"></script>
    <script src="/static/js/import-export.js"></script>
    <script src="/static/js/modal-manager.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
